<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم إرسال أذكار الصباح بنجاح</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- زخارف الخلفية -->
    <div class="decoration moon">🌙</div>
    <div class="decoration mosque">🕌</div>
    <div class="decoration star1">✨</div>
    <div class="decoration star2">⭐</div>

    <!-- نقاط البريق -->
    <div class="sparkle"></div>
    <div class="sparkle"></div>
    <div class="sparkle"></div>

    <!-- الصندوق الرئيسي -->
    <div class="container">
        <!-- زخارف إسلامية -->
        <div class="islamic-pattern pattern-1">☪️</div>
        <div class="islamic-pattern pattern-2">🌟</div>

        <!-- أيقونة النجاح -->
        <div class="success-icon">
            ✅
        </div>

        <!-- العنوان -->
        <h1>تم الإرسال بنجاح!</h1>

        <!-- الرسالة الرئيسية -->
        <p class="message">
            تم إرسال أذكار الصباح إلى بريدك الإلكتروني بنجاح ✅
        </p>

        <!-- خط فاصل -->
        <div class="divider"></div>

        <!-- رسالة إضافية -->
        <p class="sub-message">
            🌙 بارك الله في صباحك وجعل يومك مباركاً 🌙
        </p>
    </div>

    <script src="app.js"></script>
</body>
</html>
